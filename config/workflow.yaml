# Dev-Team Workflow Configuration
# Controls workflow behaviors, approval gates, execution limits, and enabled workflows.

version: 1

defaults:
  require_requirement_approval: true
  require_design_approval: true
  require_plan_approval: true
  require_qa_approval: true
  tasks_per_execution: 1

workflows:
  new_feature:
    enabled: true
    description: "Convert informal product ideas into approved, validated requirements"
    entry_point: "workflows/new-feature.md"

  requirement_validation:
    enabled: true
    description: "Independently audit requirements for clarity, completeness, and consistency"
    entry_point: "workflows/validate-requirement.md"

  feature_design:
    enabled: true
    description: "Design technical architecture based on project discovery and requirements"
    entry_point: "workflows/design-feature.md"

  create_plan:
    enabled: true
    description: "Decompose approved design into sequential, verifiable implementation tasks"
    entry_point: "workflows/create-plan.md"

  implementation:
    enabled: true
    description: "Implement one approved task at a time following existing project conventions"
    entry_point: "workflows/implement-next.md"

  feature_validation:
    enabled: true
    description: "Independently verify implemented feature against requirements and quality standards"
    entry_point: "workflows/validate-feature.md"

  bug_fixing:
    enabled: true
    description: "Diagnose, reproduce, minimally fix, and verify software defects"
    entry_point: "workflows/fix-bug.md"

  feature_status:
    enabled: true
    description: "Report accurate feature implementation progress based on project artifacts"
    entry_point: "workflows/feature-status.md"
